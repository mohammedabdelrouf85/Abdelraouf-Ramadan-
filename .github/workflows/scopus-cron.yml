name: Weekly Scopus Metrics Update

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests

    - name: Run Scopus Update Script
      env:
        SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
      run: python .github/update_scopus.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add index.html
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Auto-update Scopus metrics [skip ci]" && git push)
